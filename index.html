   accessibility switches, legal and about pages, play-stats (analytics) behind one module, live config, seasons, offline, low-power mode. */
const QS = (() => { try { return location.search || ""; } catch (e) { return ""; } })(), QUICK = /[?&]quick\b/.test(QS), SKIPOB = /[?&]skipob\b/.test(QS), NOACH = /[?&]noach\b/.test(QS), NOPICS = /[?&]nopics\b/.test(QS);   // test switches: no splash wait, no first-time flow, no achievement rewards, keep the long picture addresses
const T0 = Date.now();

/* ---- splash: the logo, a little robot, and a bar that follows the real loading steps ---- */
const Splash = {
  log: [], el: $("splash"), done: false,
  step(pct, txt) {
    this.log.push([pct, Date.now() - T0]); const f = $("spFill"), t = $("spTxt"); if (f) f.style.width = pct + "%"; if (t && txt) t.textContent = txt;
    if (this.el) this.el.setAttribute("aria-valuenow", pct);
    return new Promise(r => { let did = false; const go = () => { if (!did) { did = true; r(); } }; requestAnimationFrame(() => setTimeout(go, 0)); setTimeout(go, 70); });   // let the screen draw the bar (the timer covers a tab that is not showing)
  },
  async finish() {
    await this.step(100, "Ready!"); const wait = QUICK ? 0 : Math.max(0, 950 - (Date.now() - T0)); if (wait) await new Promise(r => setTimeout(r, wait));
    this.done = true; const el = this.el; if (!el) return; el.classList.add("out"); setTimeout(() => el.remove(), QUICK ? 0 : 420);
  },
  // starting went wrong: say so on the splash itself instead of sitting on a frozen bar
  fail(e) { const t = $("spTxt"); if (this.el) this.el.classList.add("bad"); if (t) t.textContent = "Something went wrong while starting. Close the game and open it again."; try { console.error(e); } catch (x) {} }
};

/* ---- saving: a rolling backup of the last three good saves, and an honest message if the main save is ever damaged ---- */
const BAK = ["packstack.bak1", "packstack.bak2", "packstack.bak3"];
const Safe = {
  note: null, ok: true, at: 0, bakAt: 0, due: false, told: false,
  sum(t) { let h = 2166136261; for (let i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); },
  good(d) { return !!d && typeof d === "object" && !!d.meta && typeof d.meta === "object" && !Array.isArray(d.meta); },
  parse(t) { try { const d = JSON.parse(t); return this.good(d) ? d : null; } catch (e) { return null; } },
  // a backup is stored as  checksum|time|save  so a half-written or edited one is spotted and skipped
  readBak(k) { try { const t = localStorage.getItem(k); if (!t) return null; const i = t.indexOf("|"), j = t.indexOf("|", i + 1); if (i < 1 || j < 0 || this.sum(t.slice(j + 1)) !== t.slice(0, i)) return null; const d = this.parse(t.slice(j + 1)); if (d) d.bakAt = +t.slice(i + 1, j) || 0; return d; } catch (e) { return null; } },
  // returns the save to use. A damaged main save falls back to the newest backup that still checks out.
  load() {
    let t = null; try { t = localStorage.getItem(KEY); } catch (e) { this.ok = false; return null; }
    const d = t ? this.parse(t) : null; if (d) return d;
    const baks = BAK.map(k => this.readBak(k)).filter(Boolean);
    if (!t && !baks.length) return null;   // nothing at all: a brand-new player
    if (t) { try { localStorage.setItem("packstack.corrupt", t.slice(0, 20000)); } catch (e) {} }
    if (baks.length) { this.note = { kind: "restored", at: baks[0].bakAt || 0, why: t ? "damaged" : "missing" }; return baks[0]; }
    this.note = { kind: "lost" }; return null;
  },
  save(text) {
    try { localStorage.setItem(KEY, text); this.ok = true; this.at = Date.now(); this.told = false; }
    catch (e) { this.ok = false; if (!this.told) { this.told = true; toastBot("Could not save. Your phone's storage may be full or blocked. Keep this tab open and check Settings."); } return; }
    const now = Date.now(); if (!this.due && now - this.bakAt < 120000) return;   // a backup every two minutes of play, and straight away after a milestone
    this.due = false; this.bakAt = now;
    try { const b1 = localStorage.getItem(BAK[0]), b2 = localStorage.getItem(BAK[1]); if (b1 && b1.slice(b1.indexOf("|", b1.indexOf("|") + 1) + 1) === text) return;   // nothing changed since the last backup
      if (b2) localStorage.setItem(BAK[2], b2); if (b1) localStorage.setItem(BAK[1], b1); localStorage.setItem(BAK[0], this.sum(text) + "|" + now + "|" + text); } catch (e) {}
  },
  mark() { this.due = true; },
  wipe() { for (const k of BAK.concat(["packstack.corrupt"])) { try { localStorage.removeItem(k); } catch (e) {} } this.bakAt = 0; },
  count() { return BAK.filter(k => this.readBak(k)).length; },
  ago(ms) { const s = Math.max(0, Math.round((Date.now() - ms) / 1000)); return s < 5 ? "just now" : s < 60 ? s + " seconds ago" : s < 3600 ? Math.round(s / 60) + " min ago" : s < 86400 ? Math.round(s / 3600) + " h ago" : Math.round(s / 86400) + " days ago"; },
  line() { return !this.ok ? "Not saved. Your phone's storage is full or blocked." : this.at ? "Saved " + new Date(this.at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) + " (" + this.ago(this.at) + ")" : "Saved"; }
};
// after loading: tell the player, in plain words, if their save had to be repaired
function tellRecovery() {
  const n = Safe.note; if (!n) return false; Safe.note = null; Analytics.track("save_recovered", { kind: n.kind });
  const txt = n.kind === "restored" ? `Your save file was ${n.why === "missing" ? "missing" : "damaged"}, so the game loaded your latest backup${n.at ? " (from " + Safe.ago(n.at) + ")" : ""}. Your robots, stars and packs from that backup are all here. Anything after it may need replaying.`
    : "Your save file was damaged and no backup could be read, so a fresh game was started. If you kept a save code, enter it in Settings, under Move to another phone.";
  showPop(`<div class="panel tip">${botFace("oops")}<h2>${n.kind === "restored" ? "Save restored" : "Save could not be read"}</h2><p>${txt}</p><div class="row"><button class="btn pri" data-act="pop-close" type="button">OK</button>${n.kind === "lost" ? `<button class="btn" data-act="go-code" type="button">Enter a code</button>` : ""}</div></div>`);
  return true;
}

/* ---- play stats (analytics). ONE module: to use a real service later, change only `send` below. ---- */
const ANKEY = "packstack.an";
const Analytics = {
  list: [], dirty: false, t0: Date.now(), screen: "",
  on() { return !!S.meta && S.meta.anOk === 1; },
  load() { try { const a = JSON.parse(localStorage.getItem(ANKEY) || "[]"); if (Array.isArray(a)) this.list = a.slice(-300); } catch (e) {} },
  // the single place an event leaves the game. Today it is kept on this device only. A real SDK call goes here.
  send(ev) { this.list.push(ev); if (this.list.length > 300) this.list.splice(0, this.list.length - 300); this.dirty = true; },
  track(name, props) { this.recent.push([name, Date.now()]); if (this.recent.length > 12) this.recent.shift(); if (!this.on()) return; this.send(Object.assign({ e: name, t: Date.now() }, props || {})); },
  recent: [],   // the last few things that happened (kept even with stats off, only in memory): attached to a problem report if the player sends one
  flush() { if (!this.dirty) return; this.dirty = false; if (!this.on()) return; try { localStorage.setItem(ANKEY, JSON.stringify(this.list)); } catch (e) {} },
  clear() { this.list = []; this.dirty = false; try { localStorage.removeItem(ANKEY); } catch (e) {} },

/* ---- pack odds, in plain words ---- */
function viewOdds() {
  const m = S.meta, left = Core.pityLeft(m), count = Core.RAR.map((_, r) => Core.CARDS.filter(c => c.rar === r).length);
  const atLeast = r => ((1 - Core.ODDS.reduce((miss, w) => miss * (1 - w.slice(r).reduce((a, b) => a + b, 0) / 100), 1)) * 100).toFixed(1);
  sheetIn.innerHTML = head("Pack odds") + `<div class="sheet-body" id="sheetBody">` +

function viewLegal(id) {

}
const RKEY = "packstack.reports";
const Reports = { get() { try { const a = JSON.parse(localStorage.getItem(RKEY) || "[]"); return Array.isArray(a) ? a : []; } catch (e) { return []; } }, add(r) { const a = this.get(); a.push(r); try { localStorage.setItem(RKEY, JSON.stringify(a.slice(-20))); return true; } catch (e) { return false; } } };
let devTaps = 0;

    `<section class="mn"><h3>Credits</h3><dl class="facts" id="abCredits">${GAME.credits.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl><p class="note" id="abMusic">Every picture, robot and gem is drawn by the game's own code. The Bouncy, Chill and Epic music is written and played by the game's own code too: nothing is recorded or sampled. The Lo-fi music style plays seven recorded tracks by HoliznaCC0, released into the public domain (CC0 1.0), so they are free to use in a game you sell.</p></section>` +
    `<section class="mn"><h3>Feedback</h3><p>Ideas and bug reports are welcome. Write to:</p><p class="copyline"><b id="contactTxt">${esc(GAME.contact)}</b><button class="btn sm" data-act="copy-contact" type="button">Copy</button></p><div class="row"><button class="btn pri" data-act="tab" data-id="report" type="button">Report a problem</button></div></section>` +

function copyText(txt, okMsg) { const done = () => toast(okMsg), fail = () => toast("Could not copy. Select the text and copy it by hand."); try { navigator.clipboard.writeText(txt).then(done, fail); } catch (e) { fail(); } }

/* ---- performance watcher: if frames get slow, effects are turned down automatically ---- */
const Perf = {
  avg: 0, slow: 0, fast: 0, on: false, told: false, off: QUICK,
  set(on, quiet) { if (on === this.on) return; this.on = on; document.body.classList.toggle("lowfx", on); Music.lowPower(on); Scene.apply(); if (on && !quiet && !this.told) { this.told = true; toast("Low-power mode on: fewer effects, same game."); } },
  // one reading (average milliseconds per frame). Two slow readings in a row turn effects down; three smooth ones turn them back up.
  feed(ms) { this.avg = ms; const mode = S.meta ? S.meta.lowp : 0; if (mode === 1) return this.set(true, true); if (mode === 2) return this.set(false, true); if (ms > 26) { this.slow++; this.fast = 0; if (this.slow >= 2) this.set(true); } else if (ms < 19) { this.fast++; this.slow = 0; if (this.fast >= 3) this.set(false); } else { this.slow = 0; this.fast = 0; } },
  sample() { if (this.off || document.hidden) return; let n = 0, t0 = 0; const tick = t => { if (!n) t0 = t; if (++n < 46) requestAnimationFrame(tick); else this.feed((t - t0) / 45); }; requestAnimationFrame(tick); },
  apply() { const mode = S.meta.lowp; if (mode === 1) this.set(true, true); else if (mode === 2) this.set(false, true); }
};
setInterval(() => Perf.sample(), 9000);

/* ---- offline: a service worker keeps the whole game on the phone. It can only be installed when the game is served from its own
   address (the wrapped app or your own site), not inside a preview frame, so failing to register is expected and harmless. ---- */
const Offline = {
  state: "not available here",
  start() {
    // only try when a real sw.js sits next to the page (checked first, so a preview page never logs an error for a missing file)
    try { if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) fetch("sw.js", { cache: "no-store" }).then(res => { if (!res.ok || !/javascript/.test(res.headers.get("content-type") || "")) return; const had = !!navigator.serviceWorker.controller; navigator.serviceWorker.addEventListener("controllerchange", () => { if (had) updateChip(); });   // a NEW version took over (not the very first install): offer it
        return navigator.serviceWorker.register("sw.js").then(r => { this.state = r.active ? "ready" : "installing"; try { r.update(); } catch (e) {} navigator.serviceWorker.ready.then(() => { this.state = "ready"; }); }); }).catch(() => { this.state = "not available here"; }); } catch (e) {}

};
// "New version ready": the offline helper has saved an update in the background; one tap reloads into it

    if (view) { closeSheet(); return "back"; }

};
window.__appPause = () => { try { if (drag) dragEnd(); bankTime(true); Store.save(); Sfx.hush(true); } catch (e) {} };
window.__appResume = () => { try { Sfx.hush(false); renderHud(); } catch (e) {} };
function netChip() { let c = $("netChip"); if (online()) { if (c) c.remove(); return; } if (!c) { c = document.createElement("div"); c.id = "netChip"; c.className = "netchip"; c.setAttribute("role", "status"); c.textContent = "Offline: playing from this phone"; document.body.appendChild(c); } }

/* ---- pages this file adds, and the buttons on them ---- */

let noSave = false;   // set just before a deliberate reload, so the page does not write a fresh save over the one being tested

/* ---- once everything is drawn: say so, greet a new player, report a repaired save, fetch the live config, go offline-ready ---- */
function afterBoot() {

  if (m.ob < 2) { if (SKIPOB) { m.ob = 2; } else if (!tellRecovery()) First.run(); } else tellRecovery();

  try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock("portrait").catch(() => {}); } catch (e) {}

  const vv = window.visualViewport; if (vv) { const fit = () => document.documentElement.style.setProperty("--vvh", Math.round(vv.height) + "px"); vv.addEventListener("resize", fit); fit(); }

window.__ps = { ready: false, S, Core, Camp, Levels, LV, Scene, Bots, GAME, Skin, Pics, Music, Radio, musicTrack, Splash, Safe, Analytics, Ach, Haptic, First, Live, Season, Perf, Offline, Store, AdService, AdLog, musicMode, feel, boardFx, goalSentence, robotHelp, robotRescue, RB, robotTick, offerRobots, showGetMore, chgSay, crewTap, Hub: { goHub, goPlay, tab: openSheet, start: startLevel, state: () => ({ screen, mode, view, pop: !popEl.hidden }) }, Cloud, Shop, Sfx, Fx, Gems, Fresh, save, bot, cardInner, place: doPlace, disarm, newRun, endRun, Endless, Shop, EX, contState, continueRun, renderCont, open: openSheet, close: closeSheet, redraw: () => renderAll(), check: () => afterAction(), hint: () => { renderHint(); return $("hint").textContent; }, uiRole, showNews, Out };
